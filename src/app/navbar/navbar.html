<nav
  class="d-flex justify-content-between align-items-center px-4 py-2"
  style="background-color: #007bff; color: white;"
>
  <div class="fw-bold fs-5">
    🛍️ MyStore
  </div>

  <div class="d-flex align-items-center gap-3">
    <a
      routerLink="/"
      class="text-white text-decoration-none"
    >
      Products
    </a>

    <a
      routerLink="/cart"
      class="text-white text-decoration-none position-relative"
    >
      Cart
      @if (cartService.cart().length > 0) {
        <span
          class="position-absolute rounded-circle"
          style="
            background: red;
            color: white;
            font-size: 12px;
            padding: 2px 6px;
            top: -6px;
            right: -12px;
          "
        >
          {{ cartService.cart().length }}
        </span>
      }
    </a>
  </div>
</nav>
